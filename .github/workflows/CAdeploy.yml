name: CA Deploy-Test-Cleanup Pipeline

on:
  workflow_run:
    workflows: ["Build Docker and Optional Push"]
    types: [completed]
    branches: [main, dev, demo]
  schedule:
    - cron: '0 9,21 * * *'  # 9 AM and 9 PM GMT
  workflow_dispatch:

env:
  GPT_MIN_CAPACITY: 250
  TEXT_EMBEDDING_MIN_CAPACITY: 40
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      RESOURCE_GROUP_NAME: ${{ steps.check_create_rg.outputs.RESOURCE_GROUP_NAME }}
      WEBAPP_URL: ${{ steps.get_output.outputs.WEBAPP_URL }}
      DEPLOYMENT_SUCCESS: ${{ steps.deployment_status.outputs.SUCCESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Quota Check
        id: quota-check
        run: |
          export AZURE_CLIENT_ID="${{ secrets.AZURE_CLIENT_ID }}"
          export AZURE_TENANT_ID="${{ secrets.AZURE_TENANT_ID }}"
          export AZURE_CLIENT_SECRET="${{ secrets.AZURE_CLIENT_SECRET }}"
          export AZURE_SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          export GPT_MIN_CAPACITY="150"
          export TEXT_EMBEDDING_MIN_CAPACITY="80"
          export AZURE_REGIONS="${{ vars.AZURE_REGIONS_CA }}"
          chmod +x infra/scripts/checkquota_ca.sh
          if ! infra/scripts/checkquota_ca.sh; then
            if grep -q "No region with sufficient quota found" infra/scripts/checkquota_ca.sh; then
              echo "QUOTA_FAILED=true" >> $GITHUB_ENV
            fi
            exit 1
          fi

      - name: Notify on Quota Failure
        if: env.QUOTA_FAILED == 'true'
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST "${{ secrets.LOGIC_APP_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "subject": "CA Deployment - Quota Check Failed",
              "body": "<p>The quota check failed for CA deployment.</p><p><a href=\"'${RUN_URL}'\">View run</a></p>"
            }'

      - name: Fail on Quota Check
        if: env.QUOTA_FAILED == 'true'
        run: exit 1

      - name: Install Bicep CLI
        run: az bicep install

      - name: Generate Resource Group Name
        id: generate_rg
        run: |
          NAME="ca"
          UUID=$(uuidgen | cut -d'-' -f1)
          echo "RESOURCE_GROUP_NAME=arg-${NAME}-${UUID}" >> $GITHUB_ENV

      - name: Create Resource Group
        id: check_create_rg
        run: |
          az group create --name ${{ env.RESOURCE_GROUP_NAME }} --location ${{ vars.CA_DEFAULT_LOCATION }}
          echo "RESOURCE_GROUP_NAME=${{ env.RESOURCE_GROUP_NAME }}" >> $GITHUB_OUTPUT

      - name: Determine Tag
        id: determine_tag
        run: |
          BRANCH=${{ github.ref_name }}
          if [[ "$BRANCH" == "main" ]]; then TAG="latest"
          elif [[ "$BRANCH" == "dev" ]]; then TAG="dev"
          elif [[ "$BRANCH" == "demo" ]]; then TAG="demo"
          else TAG="default"; fi
          echo "tagname=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy Infrastructure
        id: deploy
        run: |
          set -e
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP_NAME }} \
            --template-file infra/main.bicep \
            --parameters AzureOpenAILocation=${{ env.AZURE_LOCATION }} environmentName=${{ env.SOLUTION_PREFIX }} cosmosLocation=northcentralus gptDeploymentCapacity=${{ env.GPT_MIN_CAPACITY }} embeddingDeploymentCapacity=${{ env.TEXT_EMBEDDING_MIN_CAPACITY }} \


      - name: Get App URLs
        id: get_output
        run: |
          for NAME in $(az webapp list --resource-group ${{ env.RESOURCE_GROUP_NAME }} --query "[].name" -o tsv); do
            if [[ "$NAME" == app-* ]]; then
              echo "WEBAPP_URL=https://${NAME}.azurewebsites.net" >> $GITHUB_OUTPUT
            elif [[ "$NAME" == api-* ]]; then
              echo "API_APP_URL=https://${NAME}.azurewebsites.net" >> $GITHUB_OUTPUT
            fi
          done

      - name: Set Deployment Status
        id: deployment_status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "SUCCESS=true" >> $GITHUB_OUTPUT
          else
            echo "SUCCESS=false" >> $GITHUB_OUTPUT
          fi

      - name: Logout
        if: always()
        run: az logout

  e2e-test:
    needs: deploy
    if: needs.deploy.outputs.DEPLOYMENT_SUCCESS == 'true'
    uses: ./.github/workflows/test_automation.yml


    with:
      CA_WEB_URL: ${{ needs.deploy.outputs.WEBAPP_URL }}
    secrets: inherit

  cleanup:
    if: always() && needs.deploy.outputs.RESOURCE_GROUP_NAME != ''
    needs: [deploy, e2e-test]
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP_NAME: ${{ needs.deploy.outputs.RESOURCE_GROUP_NAME }}
    steps:
      - name: Setup Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete Resource Group
        run: |
          az group delete --name ${{ env.RESOURCE_GROUP_NAME }} --yes --no-wait

      - name: Logout
        if: always()
        run: az logout

      - name: Notify on Failure
        if: failure() || needs.deploy.result == 'failure' || needs.e2e-test.result == 'failure'
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -X POST "${{ secrets.LOGIC_APP_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "subject": "CA Deployment Failed",
              "body": "<p>The CA Deployment pipeline failed.</p><p><a href=\"'${RUN_URL}'\">View Run</a></p>"
            }'
